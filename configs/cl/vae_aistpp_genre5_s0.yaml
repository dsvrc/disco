# Motion VAE for the continual-learning benchmark aistpp_genre5 (TMR): trained on session 0 only
# (LA Hip-hop + Lock) with session-0 normalisation statistics, then frozen for every later session, so the
# tokenizer never sees future genres. Same architecture and losses as configs/vae_wan_1d.yaml.
#   python train_vae.py --config configs/cl/vae_aistpp_genre5_s0.yaml --override train=True
exp_name: cl_vae_aistpp_genre5_s0
seed: 1234
debug: false
train: false
is_vae: true

save_dir: ./outputs
resume_ckpt: null
test_ckpt: null
test_setting:
    render: false
    simple: true
    recover_dim: 272
val_repeat: 1

logger:
    wandb:
        wandb_key: "${wandb_info.key}"
        project: "${wandb_info.project}"
        entity: "${wandb_info.entity}"

trainer: # lightning trainer
    max_steps: 30000
    accelerator: gpu
    devices: [0]
    log_every_n_steps: 50
validation:
    validation_steps: 2500
    test_steps: 2500
    save_every_n_steps: 2500
    save_top_k: 100
metrics:
    dim: 272
    t2m:
        enable: false
    m2d:
        enable: true
        evaluate_music: false
        evaluate_physics: false

data:
    target: datasets.aistpp.AistPPDataset
    collate_fn: datasets.aistpp.collate_fn
    train_bs: 256
    val_bs: 64
    test_bs: 64
    num_workers: 2
    train_meta_paths:
        - ${dirs.raw_data}/aistpp/cl_aistpp_genre5_s0_train.txt
    val_meta_paths:
        - ${dirs.raw_data}/aistpp/cl_aistpp_genre5_s0_val.txt
    test_meta_paths:
        - ${dirs.raw_data}/aistpp/cl_aistpp_genre5_s0_test.txt
    feature_path: "motions_272_30fps"
    min_length: 64
    max_length: 1500
    window_length: 64

model:
    target: models.vae_wan_1d.VAEWanModel
    ema_decay: 0.99
    params:
        input_dim: 272
        z_dim: 4
        mean_path: "${dirs.raw_data}/cl_sessions/aistpp_genre5/s0_Mean_272.npy"
        std_path: "${dirs.raw_data}/cl_sessions/aistpp_genre5/s0_Std_272.npy"
        vel_window: [4, 67]
        root_vel_window: [1, 3]
        root_ang_vel_window: [0, 1]
        LAMBDA_ROOT_VELOCITY: 0
        LAMBDA_ROOT_ANG_VELOCITY: 0

optimizer:
    target: AdamW
    params:
        lr: 5e-4
        betas: [0.9, 0.99]
        weight_decay: 0.0
        eps: 1e-8

lr_scheduler:
    target: CosineAnnealingLR
    params:
        T_max: 1000
        eta_min: 1e-6

# Tokenise every session once with the frozen session-0 VAE (tokens for diffusion training, reconstructions
# as the fid_target='vae' references and for the style metric's VAE-domain check):
#   python pretokenize_vae.py --config configs/cl/vae_aistpp_genre5_s0.yaml --override test_ckpt=<vae ckpt>
pretokenize:
    path_files:
        - raw_data/aistpp/cl_aistpp_genre5_s0_train.txt
        - raw_data/aistpp/cl_aistpp_genre5_s0_val.txt
        - raw_data/aistpp/cl_aistpp_genre5_s0_test.txt
        - raw_data/aistpp/cl_aistpp_genre5_s1_train.txt
        - raw_data/aistpp/cl_aistpp_genre5_s1_val.txt
        - raw_data/aistpp/cl_aistpp_genre5_s1_test.txt
        - raw_data/aistpp/cl_aistpp_genre5_s2_train.txt
        - raw_data/aistpp/cl_aistpp_genre5_s2_val.txt
        - raw_data/aistpp/cl_aistpp_genre5_s2_test.txt
        - raw_data/aistpp/cl_aistpp_genre5_s3_train.txt
        - raw_data/aistpp/cl_aistpp_genre5_s3_val.txt
        - raw_data/aistpp/cl_aistpp_genre5_s3_test.txt
        - raw_data/aistpp/cl_aistpp_genre5_s4_train.txt
        - raw_data/aistpp/cl_aistpp_genre5_s4_val.txt
        - raw_data/aistpp/cl_aistpp_genre5_s4_test.txt
    feature_path: motions_272_30fps
    token_path: TOKENS_cl_aistpp_genre5_s0vae
    recovered_path: RECOVERED_cl_aistpp_genre5_s0vae
