metadata: 
  run_name: 'VQ_PAE-gtzan_1000_eps-8emb'  ## GTZAN training with 8 embedding channels
  log_dir: 'logs' 
  logging: Yes
  check_val_every_n_epoch: 50  ## validate every 50 epochs
  test_every_n_epochs: 100  ## test every 100 epochs during training

dataset_config: 
  dataset: 'audio_dataset' 
  dataset_root: '../../raw_data/gtzan/Data'  ## GTZAN wavs dataset
  resume: null
  original_rate: 44100  ## keep training settings unchanged
  target_rate: 16000
  lowpass_cutoff: 8000
  window_length: 6.0  ## Fixed: must match model time_range (6 seconds)

training_config: 
  grid_search: No 
  num_epochs: 2000
  batch_size: 4  ## Fixed: 6-sec window needs smaller batch to avoid OOM
  batch_size_validation: 2  ## Fixed: reduced for validation
  optimizer: 'adam' 
  optimizer_lr: 0.001 
  optimizer_momentum: 0.9 
  optimizer_weight_decay: 0.001 
  optimizer_float_16: False 
  lr_scheduler: 'poly' 
  lr_scheduler_power: 0.9 
  ckpt_save_dir: 'logs/checkpoints' 
  resume: null

loss_config: 
  loss_weights: 
    mse_loss: 1.0
    l1_loss: 2.0 
    sisdr_loss: 0.0 
    stft_loss_spectral_convergence: 20.0 
    stft_loss_magnitude: 1.0
    mel_spectrogramm_loss: 15.0 
    vq/commitment_loss: 1.0 
    vq/codebook_loss: 0.25
  
model_config: 
  experiment_name: 'VQ_PAEModel' 
  model_name: 'vq_pae' 
  vq_only: false
  input_channels: 1 
  intermediate_channels: 64 
  embedding_channels: 8
  time_range: 96000  ## Fixed: 6.0 seconds × 16000 Hz = 96000 samples
  window: 6.0
  use_fft_mlp: False 
  enc_dilation_rates: [9, 3, 1] 
  enc_kernel_sizes: [7, 3, 3] 
  dec_dilation_rates: [1, 3, 9] 
  dec_kernel_sizes: [3, 3, 7] 
  vq: 
    input_dim: 8  ## keep the same as embedding_channels
    n_codebooks: 9 
    codebook_size: 1024 
    codebook_dim: 8
  phase_predictor: 
    input_dim: 8 
    output_dim: 4
  activation: 'elu' 
  combiner: 'concat'

worker_config: 
  workers: 8  ## use 8 workers for parallel data loading
  workers_validation: 4  ## use 4 workers for validation
