exp_name: vae_wan_1d_multi_272_stand # Experiment names
# exp_name: vae_wan_1d_multi_272 # Experiment names
seed: 1234 # Seed value
debug: false
train: false
is_vae: true

save_dir: ./outputs
resume_ckpt: null
test_ckpt: null
test_setting:
    render: true
    simple: true
    recover_dim: 272
    finedance:
        compare_folders:
            - "${dirs.raw_data}/finedance/animations_272_30fps_sliced"
        compare_names:
            - "Ground Truth"
        music_dir: "${dirs.raw_data}/finedance/music_wav_sliced"
    aistpp:
        compare_folders:
            - "${dirs.raw_data}/aistpp/animations_272_30fps"
        compare_names:
            - "Ground Truth"
        music_dir: "${dirs.raw_data}/aistpp/wavs_272_sliced"
    babel:
        compare_folders:
            - "${dirs.raw_data}/babel_272/all_stream_stand_30fps_animations"
        compare_names:
            - "Ground Truth"
        music_dir: "${dirs.raw_data}/babel_272/near_silence_wavs_15360_stand"
val_repeat: 1

logger:
    wandb:
        wandb_key: "${wandb_info.key}"
        project: "${wandb_info.project}"
        entity: "${wandb_info.entity}"

trainer: # lightning trainer
    max_steps: 1000000
    accelerator: gpu
    devices: [0]
    log_every_n_steps: 50
validation:
    validation_steps: 10000
    test_steps: 10000
    save_every_n_steps: 10000
    save_top_k: 100
metrics:
    dim: 272
    m2d:
        enable: true
        evaluate_music: false
        evaluate_physics: false

data:
    target: datasets.multi.MultiDataset
    collate_fn: datasets.multi.collate_fn
    train_bs: 4096
    val_bs: 512
    test_bs: 512
    num_workers: 8
    datasets:
        - target: datasets.finedance.FineDanceDataset
          train_meta_paths:
              - ${dirs.raw_data}/finedance/train_sliced.txt
          val_meta_paths:
              - ${dirs.raw_data}/finedance/test_sliced.txt
          test_meta_paths:
              - ${dirs.raw_data}/finedance/test_short_sliced.txt
          feature_path: "motion_272_30fps_sliced"
          token_path: null
          text_path: null
          min_length: 64
          max_length: 300
          window_length: 64
        - target: datasets.aistpp.AistPPDataset
          train_meta_paths:
              - ${dirs.raw_data}/aistpp/crossmodal_train_without_val.txt
          val_meta_paths:
              - ${dirs.raw_data}/aistpp/crossmodal_val.txt
          test_meta_paths:
              - ${dirs.raw_data}/aistpp/crossmodal_test.txt
          feature_path: "motions_272_30fps"
          min_length: 64
          max_length: 1500
          window_length: 64
        - target: datasets.babel.BabelDataset
          train_meta_paths:
              - ${dirs.raw_data}/babel_272/train_stand.txt
          val_meta_paths:
              - ${dirs.raw_data}/babel_272/test_stand.txt
          test_meta_paths:
              - ${dirs.raw_data}/babel_272/test_stand_20.txt
          feature_path: "all_stream_stand_30fps"
          min_length: 64
          max_length: 4000
          window_length: 64

model:
    target: models.vae_wan_1d.VAEWanModel
    ema_decay: 0.99
    params:
        input_dim: 272
        z_dim: 4
        mean_path: "${dirs.raw_data}/multi_stand_272_sliced/Mean_272.npy"
        std_path: "${dirs.raw_data}/multi_stand_272_sliced/Std_272.npy"
        # mean_path: "${dirs.raw_data}/multi_272/Mean_272.npy"
        # std_path: "${dirs.raw_data}/multi_272/Std_272.npy"
        vel_window: [4, 67]
        root_vel_window: [1, 3]
        root_ang_vel_window: [0, 1]
        LAMBDA_ROOT_VELOCITY: 0
        LAMBDA_ROOT_ANG_VELOCITY: 0

optimizer:
    target: AdamW
    params:
        lr: 5e-4
        betas: [0.9, 0.99]
        weight_decay: 0.0
        eps: 1e-8

# lr_scheduler:
#     target: diffusers.optimization.get_constant_schedule_with_warmup
#     params:
#         num_warmup_steps: 1000

lr_scheduler:
    target: CosineAnnealingLR
    params:
        T_max: 1000
        eta_min: 1e-6

# python utils/librosa_preprocess.py --src raw_data/babel_272/near_silence_wavs_15360_stand --dest raw_data/babel_272/near_silence_feats_window_32 --window_size 32